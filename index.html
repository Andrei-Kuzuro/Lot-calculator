<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lot Calculator</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root { --bg: #0d0d0d; --card: #181818; --field: #101010; --border: #2b2b2b; --gold: #ffd700; --muted: #888; --error: #ff4444; --long: #00c853; --short: #ff1744; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; justify-content: center; padding: 10px; touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
    .app { width: min(100%, 430px); background: var(--card); border: 1px solid #262626; border-radius: 14px; padding: 14px; min-height: calc(100vh - 20px); display: flex; flex-direction: column; }
    h1 { font-size: 18px; margin: 0 0 2px; color: var(--gold); }
    .sub { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .field { margin-bottom: 7px; position: relative; }
    label { display: block; font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: .35px; margin: 0 0 3px; }
    input, select { touch-action: manipulation; width: 100%; height: 42px; background: var(--field); border: 1px solid #303030; border-radius: 7px; color: #fff; font-size: 16px; padding: 0 9px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    input.input-error { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); }
    select optgroup { background: #181818; color: var(--gold); font-weight: 700; }
    select option { background: #101010; color: #fff; }
    .hint { font-size: 9px; color: #555; margin-top: 3px; }
    .error-msg { font-size: 10px; color: var(--error); margin-top: 3px; display: none; }
    .error-msg.show { display: block; }
    button.calc { touch-action: manipulation; width: 100%; height: 44px; margin-top: 8px; border: 0; border-radius: 7px; background: var(--gold); color: #000; font-size: 15px; font-weight: 700; cursor: pointer; }
    button.calc:active { opacity: 0.8; }
    .results { display: none; border-top: 1px solid #292929; margin-top: 12px; padding-top: 12px; }
    .results.show { display: block; }
    .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .box { background: #101010; border: 1px solid #292929; border-radius: 8px; padding: 8px; text-align: center; }
    .box.main { border-color: var(--gold); background: #181500; grid-column: span 2; }
    .rlabel { font-size: 8px; color: #666; text-transform: uppercase; margin-bottom: 2px; }
    .rvalue { font-size: 17px; font-weight: 600; }
    .main .rvalue { font-size: 24px; color: var(--gold); }
    .direction-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 4px; }
    .direction-badge.long { background: rgba(0, 200, 83, 0.2); color: var(--long); }
    .direction-badge.short { background: rgba(255, 23, 68, 0.2); color: var(--short); }
    .warning { display: none; margin-top: 8px; padding: 8px; border: 1px solid #ff8c00; border-radius: 7px; color: #ff9a00; background: #241500; font-size: 11px; text-align: center; }
    .warning.show { display: block; }
    @media (max-width: 600px) {
      body { padding: 0; align-items: flex-start; }
      .app { border: 0; border-radius: 0; min-height: 100vh; padding: 12px 14px 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Калькулятор позиции</h1>
    <p class="sub">Введи параметры — получи размер лота</p>

    <div class="field">
      <label>Инструмент</label>
      <select id="instrument">
        <optgroup label="КРИПТОВАЛЮТЫ">
          <option value="btcusd">BTCUSD</option>
          <option value="ethusd">ETHUSD</option>
        </optgroup>
        <optgroup label="ИНДЕКСЫ">
          <option value="us500">US500 (S&P)</option>
          <option value="us100">US100 (Nasdaq)</option>
          <option value="ger40">GER40 (DAX)</option>
          <option value="japan225">JAPAN225 (Nikkei)</option>
        </optgroup>
        <optgroup label="ДРАГМЕТАЛЛЫ">
          <option value="xauusd">Золото (XAUUSD)</option>
          <option value="xagusd">Серебро (XAGUSD)</option>
          <option value="xptusd">Платина (XPTUSD)</option>
        </optgroup>
        <optgroup label="ВАЛЮТНЫЕ ПАРЫ (Основные *USD)">
          <option value="eurusd">EURUSD</option>
          <option value="gbpusd">GBPUSD</option>
          <option value="audusd">AUDUSD</option>
          <option value="nzdusd">NZDUSD</option>
        </optgroup>
        <optgroup label="ВАЛЮТНЫЕ ПАРЫ (Кросс-пары)">
          <option value="usdcad">USDCAD</option>
          <option value="usdjpy">USDJPY</option>
          <option value="usdchf">USDCHF</option>
          <option value="eurgbp">EURGBP</option>
          <option value="eurjpy">EURJPY</option>
        </optgroup>
      </select>
      <div class="hint">Используй клавиатуру с точкой. Запятая заменится автоматически.</div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>Депозит ($)</label>
        <input id="deposit" type="text" inputmode="decimal" placeholder="1000" value="1000">
        <div class="error-msg" id="err-deposit">Введи корректный депозит</div>
      </div>
      <div class="field">
        <label>Риск (%)</label>
        <input id="risk" type="text" inputmode="decimal" placeholder="2" value="2">
        <div class="error-msg" id="err-risk">Введи процент риска</div>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>Цена входа</label>
        <input id="entry" type="text" inputmode="decimal" placeholder="1.0500">
        <div class="error-msg" id="err-entry">Введи цену входа</div>
      </div>
      <div class="field">
        <label>Цена стопа</label>
        <input id="stop" type="text" inputmode="decimal" placeholder="1.0450">
        <div class="error-msg" id="err-stop">Введи цену стопа</div>
      </div>
    </div>

    <button class="calc" onclick="calculate()">Рассчитать лот</button>

    <section class="results" id="results">
      <div class="results-grid">
        <div class="box">
          <div class="rlabel">Направление</div>
          <div class="rvalue" id="direction">—</div>
        </div>
        <div class="box">
          <div class="rlabel">Сумма риска</div>
          <div class="rvalue" id="riskAmount">—</div>
        </div>
        <div class="box">
          <div class="rlabel">До стопа</div>
          <div class="rvalue" id="pips">—</div>
        </div>
        <div class="box">
          <div class="rlabel">Цена пункта</div>
          <div class="rvalue" id="pipValue">—</div>
        </div>
        <div class="box main">
          <div class="rlabel">Размер лота</div>
          <div class="rvalue" id="lotSize">—</div>
        </div>
      </div>
      <div class="warning" id="warning"></div>
    </section>
  </main>

  <script>
    // 1. Вспомогательные функции
    const num = (id) => parseFloat(document.getElementById(id).value.replace(',', '.')) || 0;
    const hideKeyboard = () => { document.activeElement.blur(); };

    // 2. Данные инструментов (pipSize: размер пункта, pipValue: стоимость пункта за 1 стандартный лот в USD)
    const instruments = {
      btcusd: { pipSize: 0.01, pipValue: 1, unit: 'пунктов' },
      ethusd: { pipSize: 0.01, pipValue: 1, unit: 'пунктов' },
      us500: { pipSize: 1, pipValue: 1, unit: 'пунктов' },
      us100: { pipSize: 1, pipValue: 1, unit: 'пунктов' },
      ger40: { pipSize: 1, pipValue: 1, unit: 'пунктов' },
      japan225: { pipSize: 1, pipValue: 1, unit: 'пунктов' },
      xauusd: { pipSize: 0.01, pipValue: 1, unit: 'пунктов' },
      xagusd: { pipSize: 0.01, pipValue: 1, unit: 'пунктов' },
      xptusd: { pipSize: 0.01, pipValue: 1, unit: 'пунктов' },
      eurusd: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      gbpusd: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      audusd: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      nzdusd: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      usdcad: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      usdjpy: { pipSize: 0.01, pipValue: 10, unit: 'пипсов' },
      usdchf: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      eurgbp: { pipSize: 0.0001, pipValue: 10, unit: 'пипсов' },
      eurjpy: { pipSize: 0.01, pipValue: 10, unit: 'пипсов' }
    };

    // 3. Обработка ввода (замена запятой на точку)
    document.querySelectorAll('input').forEach(input => {
      // Загрузка сохраненных значений при старте
      if (input.id === 'deposit' || input.id === 'risk') {
        const saved = localStorage.getItem(input.id);
        if (saved) input.value = saved;
      }

      input.addEventListener('input', function() {
        const oldValue = this.value;
        const normalized = oldValue.replace(/,/g, '.');
        if (normalized !== oldValue) {
          const pos = this.selectionStart;
          this.value = normalized;
          if (pos !== null) this.setSelectionRange(pos, pos);
        }
        // Сохраняем настройки
        if (this.id === 'deposit' || this.id === 'risk') {
          localStorage.setItem(this.id, this.value);
        }
        // Убираем ошибку при вводе
        this.classList.remove('input-error');
        document.getElementById('err-' + this.id).classList.remove('show');
      });

      input.addEventListener('paste', function() {
        setTimeout(() => {
          this.value = this.value.replace(/,/g, '.');
          if (this.id === 'deposit' || this.id === 'risk') localStorage.setItem(this.id, this.value);
        }, 0);
      });
    });

    // Блокировка зума жестами на iOS
    document.addEventListener('gesturestart', e => e.preventDefault(), {passive: false});
    document.addEventListener('gesturechange', e => e.preventDefault(), {passive: false});
    document.addEventListener('gestureend', e => e.preventDefault(), {passive: false});

    // 4. Логика расчета
    function calculate() {
      hideKeyboard();
      clearErrors();

      const instrumentKey = document.getElementById('instrument').value;
      const deposit = num('deposit');
      const riskPct = num('risk');
      const entry = num('entry');
      const stop = num('stop');

      let hasError = false;
      if (!deposit || deposit <= 0) { showError('deposit'); hasError = true; }
      if (!riskPct || riskPct <= 0) { showError('risk'); hasError = true; }
      if (!entry || entry <= 0) { showError('entry'); hasError = true; }
      if (!stop || stop <= 0) { showError('stop'); hasError = true; }
      
      if (hasError) return;
      if (Math.abs(entry - stop) < 1e-12) {
        alert('Цена входа и стопа не могут быть одинаковыми');
        return;
      }

      const inst = instruments[instrumentKey];
      const riskAmount = deposit * (riskPct / 100);
      const pips = Math.abs(entry - stop) / inst.pipSize;
      const lot = riskAmount / (pips * inst.pipValue);
      const isLong = entry > stop; // Если стоп ниже входа, это покупка (Long)

      // Вывод результатов
      document.getElementById('direction').innerHTML = `<span class="direction-badge ${isLong ? 'long' : 'short'}">${isLong ? 'LONG' : 'SHORT'}</span>`;
      document.getElementById('riskAmount').textContent = '$' + riskAmount.toFixed(2);
      document.getElementById('pips').textContent = pips.toFixed(1) + ' ' + inst.unit;
      document.getElementById('pipValue').textContent = '$' + (inst.pipValue * lot).toFixed(2);
      document.getElementById('lotSize').textContent = lot.toFixed(3);

      // Предупреждения
      const w = document.getElementById('warning');
      if (lot < 0.001) {
        w.textContent = '⚠️ Слишком маленький лот. Уменьши стоп или увеличь депозит.';
        w.classList.add('show');
      } else if (lot > 10) {
        w.textContent = '⚠️ Очень большой лот. Проверь правильность введенных данных.';
        w.classList.add('show');
      } else {
        w.classList.remove('show');
      }

      document.getElementById('results').classList.add('show');
    }

    function showError(fieldId) {
      document.getElementById(fieldId).classList.add('input-error');
      document.getElementById('err-' + fieldId).classList.add('show');
    }

    function clearErrors() {
      document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
      document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

    // 5. Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
